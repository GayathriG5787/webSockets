<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0f19;
        }
        .chat-container {
            height: calc(100vh - 40px);
            max-width: 1000px;
            margin: 20px auto;
            background: #111827;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f2937;
        }
        .chat-header {
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 15px 24px;
        }
        .messages-box {
            height: calc(100% - 145px);
            /* Vertical scrollbar appears */
            overflow-y: auto;
            padding: 24px;
            background-color: #0f172a;
        }
        /* Custom sleek scrollbar for dark mode */
        .messages-box::-webkit-scrollbar {
            width: 6px;
        }
        .messages-box::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 3px;
        }
        .message-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 12px;
            background-color: #1f2937;
            border: 1px solid #374151;
            width: fit-content;
            overflow-wrap: break-word;
            color: #f3f4f6;
        }
        .input-area {
            background-color: #111827;
            border-top: 1px solid #1f2937;
            padding: 15px 24px;
        }
        .input-group .form-control {
            /* top-left, top-right, bottom-right, bottom-left */
            border-radius: 24px 0 0 24px;
            padding-left: 20px;
            background-color: #1f2937;
            border-color: #374151;
            color: #f3f4f6;
        }
        .input-group .form-control::placeholder {
            color: #9ca3af;
        }
        .input-group .form-control:focus {
            box-shadow: none;
            border-color: #3b82f6;
            background-color: #1f2937;
            color: #f3f4f6;
        }
        .input-group .btn {
            border-radius: 0 24px 24px 0;
            padding-left: 24px;
            padding-right: 24px;
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .input-group .btn:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .my-message {
            display: flex;
            justify-content: flex-end;
        }

        .other-message {
            display: flex;
            justify-content: flex-start;
        }

        .my-message .message-bubble {
            border-top-right-radius: 0;
        }

        .other-message .message-bubble {
            border-top-left-radius: 0;
        }

        /* Micro-responsiveness optimizations targeting sub-280px screen sizes down to 170px */
        @media (max-width: 280px) {
            .chat-container {
                margin: 5px auto;
                height: calc(100vh - 10px);
                border-radius: 8px;
            }
            .chat-header {
                padding: 10px 12px;
            }
            /* Shrink avatar layout slightly to gain space */
            .chat-header .rounded-circle {
                width: 35px !important;
                height: 35px !important;
                margin-right: 8px !important;
            }
            .chat-header h1 {
                font-size: 0.95rem;
            }
            .chat-header small {
                font-size: 0.7rem;
            }
            .messages-box {
                padding: 12px;
                /* Adjust dynamic viewport heights due to smaller padding profiles */
                height: calc(100% - 110px); 
            }
            .message-bubble {
                max-width: 85%;
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            .input-area {
                padding: 10px 12px;
            }
            .input-group .form-control {
                padding-left: 12px;
                font-size: 0.85rem;
            }
            /* Safely hide the text string 'Send' to keep standard input bar layouts seamless */
            .input-group .btn span {
                display: none;
            }
            .input-group .btn {
                padding-left: 14px;
                padding-right: 14px;
            }
        }
        
    </style>
</head>
<body>

    <div class="container-fluid px-2 px-sm-3">
        <div class="chat-container d-flex flex-column">
            
            <div class="chat-header d-flex align-items-center">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-25 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px; border: 1px solid rgba(37, 99, 235, 0.4);">
                        <i class="bi bi-chat-dots-fill fs-5"></i>
                    </div>
                    <div>
                        <h1 class="h5 mb-0 fw-bold text-white">Let's chat!</h1>
                        <small class="text-success d-flex align-items-center gap-1">
                            <span class="spinner-grow spinner-grow-sm text-success" role="status" style="width: 8px; height: 8px;"></span>
                            Live Room: test
                        </small>
                    </div>
                </div>
            </div>

            <div id="messages" class="messages-box">
                </div>

            <div class="input-area">
                <form action="" id="form">
                    <div class="input-group">
                        <input type="text" id="message-input" name="message" class="form-control" placeholder="Type a message" autocomplete="off" required>
                        <button class="btn btn-primary d-flex align-items-center gap-2" type="submit">
                            <span>Send</span>
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // window.location.host returns the current host and port of the website. 
        // In my project, the host is 127.0.0.1:8000
        // host name identifies the machine, port identifies the application that is listening
        // ws: represents Web Socket protocol
        // In production, we use wss: protocol (Secure WebSocket)
        let url = `ws://${window.location.host}/ws/socket-server/`

        const clientId = crypto.randomUUID();

        // Creates a websocket connection
        // Tells browser to open ws connection to server at this URL
        // request sent to routing and consumer object is created and calls connect() inside it
        const chatSocket = new WebSocket(url)

        // Runs whenever the server sends a msg through the ws
        // e inside function is an event object, contains information about the received message
        // Browser receives data from the server
        chatSocket.onmessage = function(e) {
            // The browser receives e.data as a string, we are converting it into object, so that we can access messages inside it
            let data = JSON.parse(e.data)
            console.log('Data:', data)

            if (data.type === 'chat'){

                let isMine = data.sender_id === clientId;

                let messages = document.getElementById('messages')

                // beforeend => inside the messages element but as the last child
                messages.insertAdjacentHTML(
                    'beforeend',
                    `
                    <div class="${isMine ? 'my-message' : 'other-message'}">
                        <div class="message-bubble">
                            <p class="mb-0">${data.message}</p>
                        </div>
                    </div>
                    `
                );
                
                // Auto-scrolls the message panel to the bottom when a new message arrives
                messages.scrollTop = messages.scrollHeight;
            }
        }

        let form = document.getElementById('form')
        form.addEventListener('submit', (e) => {
            // No browser refresh after form submission and no navigation to another URL
            e.preventDefault()
            let message = e.target.message.value

            // Browser sends data to the server
            // JSON.stringify() converts JS object into a JSON string
            chatSocket.send(JSON.stringify({
                'message': message,
                'sender_id': clientId
            }))
            form.reset()

        })

        const messageInput = document.getElementById('message-input');

        function updatePlaceholder() {
            if (window.innerWidth < 320) {
                messageInput.placeholder = "Type";
            } else {
                messageInput.placeholder = "Type a message";
            }
        }

        updatePlaceholder(); // Run when page loads
        window.addEventListener('resize', updatePlaceholder); // Run when screen size changes

    </script>
</body>
</html>
